# Режим разработки: правки в backend/app подхватываются сами (--reload), интерфейс — через Vite с горячей перезагрузкой.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Нужен Docker Compose 2.24+ (теги !reset и !override). Воркер сам не перезапускается: после правок — docker compose restart worker.
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./sample_data:/app/sample_data

  worker:
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./sample_data:/app/sample_data

  web:
    image: node:22-alpine
    build: !reset {}
    working_dir: /web
    environment:
      API_URL: http://api:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports: !override ["5173:5173"]
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api

volumes:
  web_node_modules:
