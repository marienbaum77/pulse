# Pulse: полный self-hosted стек.  Запуск:  cp .env.example .env  →  отредактировать  →  docker compose up -d --build
# Groq is the default OpenAI-compatible chat API; Ollama remains local for embeddings.
x-backend: &backend
  build: { context: ., dockerfile: backend/Dockerfile }
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
  environment: &backend-env
    DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@db:5432/pulse
    SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env (openssl rand -hex 32)}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    LLM_PROVIDER: ${LLM_PROVIDER:-openai}
    LLM_CHAT_ENABLED: ${LLM_CHAT_ENABLED:-true}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
    LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
    EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    EMBED_BASE_URL: ${EMBED_BASE_URL:-http://ollama:11434/v1}
    EMBED_API_KEY: ${EMBED_API_KEY:-}
    IMAGE_CACHE_DIR: ${IMAGE_CACHE_DIR:-/var/cache/pulse/images}
    IMAGE_CACHE_MAX_MB: ${IMAGE_CACHE_MAX_MB:-500}
    IMAGE_CACHE_MAX_AGE_DAYS: ${IMAGE_CACHE_MAX_AGE_DAYS:-30}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
    RETENTION_DAYS: ${RETENTION_DAYS:-30}
  volumes:
    - image-cache:/var/cache/pulse/images

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: pulse
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json')"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      # 3 = отдельный воркер для сбора RSS (ingest_source/enrich_articles) + отдельный для generate + общий.
      # Каждый следующий добавляет общий воркер (process_project и т.п.). 2 = сбор + общий, 1 = всё в одном.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["${PULSE_PORT:-8080}:80"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    # Для GPU NVIDIA раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Бэкап Postgres на диск хоста (./backups): раз в BACKUP_INTERVAL_HOURS, без векторов (они пересчитываются), с ротацией.
  # Том pgdata переживает пересоздание контейнеров, но не docker compose down -v и не потерю диска — для этого и нужны дампы.
  # Скрипты копируются с удалением CR: файл мог быть сохранён в Windows с CRLF.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_STRIP_VECTORS: ${BACKUP_STRIP_VECTORS:-true}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/src/backup.sh:ro
      - ./deploy/strip-vectors.awk:/src/strip-vectors.awk:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        tr -d '\r' < /src/backup.sh > /tmp/backup.sh
        tr -d '\r' < /src/strip-vectors.awk > /usr/local/share/strip-vectors.awk
        exec bash /tmp/backup.sh

volumes:
  pgdata:
  ollama:
  image-cache:
