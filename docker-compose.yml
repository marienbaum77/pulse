# Pulse: полный self-hosted стек.  Запуск:  cp .env.example .env  →  отредактировать  →  docker compose up -d --build
# Ollama запускается вместе с остальным стеком; модели скачиваются отдельно.
x-backend: &backend
  build: { context: ., dockerfile: backend/Dockerfile }
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
  environment: &backend-env
    DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@db:5432/pulse
    SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env (openssl rand -hex 32)}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    LLM_PROVIDER: ${LLM_PROVIDER:-stub}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
    LLM_API_KEY: ${LLM_API_KEY:-ollama}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
    LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
    EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    EMBED_BASE_URL: ${EMBED_BASE_URL:-}
    EMBED_API_KEY: ${EMBED_API_KEY:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
    RETENTION_DAYS: ${RETENTION_DAYS:-30}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: pulse
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json')"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["${PULSE_PORT:-8080}:80"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # Для GPU NVIDIA раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Ночной бэкап Postgres на диск хоста (./backups). Том pgdata переживает пересоздание контейнеров,
  # но не docker compose down -v и не потерю диска — для этого и нужны дампы.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "Pulse backup: первый дамп через ~60 с, далее раз в сутки. Каталог: /backups"
        sleep 60
        while true; do
          ts=$$(date +%F_%H%M)
          pg_dump -h db -U pulse -d pulse | gzip > "/backups/pulse-$$ts.sql.gz"
          echo "Создан /backups/pulse-$$ts.sql.gz"
          find /backups -name 'pulse-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete 2>/dev/null || true
          sleep 86400
        done

volumes:
  pgdata:
  ollama:
